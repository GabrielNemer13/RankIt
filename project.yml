name: RankIt
options:
  bundleIdPrefix: com.gabrielnemer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  RankIt:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RankIt
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielnemer.RankIt
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # Custom keys (TMDBAPIKey) and per-idiom keys (~ipad orientations)
        # don't survive as INFOPLIST_KEY_* build settings once INFOPLIST_FILE
        # is also set -- Xcode silently drops them from the generated
        # plist. They're written directly into SupplementaryInfo.plist
        # instead, with the same $(TMDB_API_KEY) substitution.
        INFOPLIST_FILE: RankIt/SupplementaryInfo.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  RankItTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RankItTests
    dependencies:
      - target: RankIt
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RankIt:
    build:
      targets:
        RankIt: [run, archive, analyze, profile]
        RankItTests: [test]
    test:
      targets:
        - RankItTests
